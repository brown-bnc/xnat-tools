name: 🚀 Publish New Release
on: [workflow_dispatch]

env:
  # TODO: THis name is wrong? I think it always has been wrong?
  # TODO: This should be brown-bnc/xnat-tools
  # IMAGE_NAME: brownbnc/xnat-tools
  # TODO: I also don't think it's needed at all? The name matches the repository?
  IMAGE_NAME: brown-bnc/xnat-tools
  REGISTRY: ghcr.io
  REPOSITORY: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    name: 🚀 Publish New Release
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create bump and changelog
        uses: commitizen-tools/commitizen-action@0.27.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: 💾 Store changelog changes
        run: |
          echo 'CHANGELOG<<EOF' >> $GITHUB_ENV
          grep -B10000 -m2 "^## v"  CHANGELOG.md | sed '$d' >> $GITHUB_ENV
          echo 'EOF' >> $GITHUB_ENV

      - name: 💾 Store VERSION
        run: |
          echo "VERSION=$(cat pyproject.toml | grep version | head -1 | awk -F: '{ print $1 }'| sed 's/[\",]//g'| tr -d 'version = ')" >> $GITHUB_ENV

      # TODO: THis action is now archived. Need something new.
      - name: 🚀 Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "v${VERSION}"
          release_name: "v${VERSION}"
          body: "${CHANGELOG}"
          draft: false
          prerelease: false

      # DOCS
      # TODO: This should be a secondary job with "needs"
      - name: 🐍 Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: ☀️ Setup UV
        uses: astral-sh/setup-uv@v5

      - name: 📥 Install docs dependencies
        run: uv pip install .[docs]
        env:
          UV_SYSTEM_PYTHON: 1

      - name: 📥 Install typer-cli
        run: uv pip install typer-cli
        env:
          UV_SYSTEM_PYTHON: 1

      - name: Set up mkdocs config
        run: (envsubst 'v${VERSION}' < mkdocs-template.yml) > mkdocs.yml

      - name: 🔄️ Sync mkdocs versions
        run: mkdocs-versioning sync

      - name: 🧹 Clean Docs
        run: rm -rf ./site/.git/

      - name: 🏗️ Build Docs
        run: mkdocs build

      - name: 🚀 Deploy Docs
        run: mkdocs-versioning -v deploy

      ## Docker
      # TODO: This should be a secondary job with "needs"
      # TODO: I'm pretty sure we DON'T need QEMU?
      - name: 🛠️ Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # TODO: This is publishing to dockerhub?
      # TODO: SHould we be using GHCR?
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏗️ Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          # images: ${{ env.IMAGE_NAME }}
          images: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}
          # TODO: These are a mismatch with the tests config?
          # type=ref,event=branch
          # type=ref,event=pr
          # type=semver,pattern={{major}}.{{minor}}
          tags: |
            # type=semver,pattern={{raw}},value=v${{ env.VERSION }}
            type=semver,pattern={{raw}},value="v${VERSION}

      # NOTE: We are tapping into json output because tags could become a list if prior step is modified
      - name: 💾 Save Image ID
        id: image_id
        run: |
          echo "${{ fromJSON(steps.meta.outputs.json).tags[0] }}"
          echo "::set-output name=image_id::${{ fromJSON(steps.meta.outputs.json).tags[0] }}"

      - name: 🐳 Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # TODO: Caching wasn't here before?
          # Include both a shared cache and a per-image cache
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.REPOSITORY }}/shared:buildcache
            type=registry,ref=${{ steps.image_id.outputs.image_id }}:buildcache
          cache-to: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.REPOSITORY }}/shared:buildcache,mode=max
            type=registry,ref=${{ steps.image_id.outputs.image_id }}:buildcache,mode=max
