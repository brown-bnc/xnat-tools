name: 🚀 Publish New Release
on: [workflow_dispatch]

env:
  # TODO: THis name is wrong? I think it always has been wrong?
  # TODO: This should be brown-bnc/xnat-tools
  # TODO: I also don't think it's needed at all? The name matches the repository otherwise?
  # IMAGE_NAME: brownbnc/xnat-tools
  REGISTRY: ghcr.io
  REPOSITORY: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    name: 🚀 Publish New Release
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 👊 Commitizen version bump
        uses: commitizen-tools/commitizen-action@0.27.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: 💾 Store changelog changes
        id: changelog
        run: |
          echo 'CHANGELOG<<EOF' >> "$GITHUB_OUTPUT"
          grep -B10000 -m2 "^## v"  CHANGELOG.md | sed '$d' >> "$GITHUB_OUTPUT"
          echo 'EOF' >> "$GITHUB_OUTPUT"

      - name: 💾 Store VERSION
        id: version
        run: echo "VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"

      # TODO: THis action is now archived. Need something new.
      - name: 🚀 Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          release_name: "v${{ steps.version.outputs.version }}"
          body: "${{ steps.changelog.outputs.changelog }}"
          draft: false
          prerelease: false

      # DOCS
      # TODO: This should be a secondary job with "needs"
      - name: 🐍 Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: ☀️ Setup UV
        uses: astral-sh/setup-uv@v5

      - name: 📥 Install docs dependencies
        run: uv pip install .[docs]
        env:
          UV_SYSTEM_PYTHON: 1

      - name: 📥 Install typer-cli
        run: uv pip install typer-cli
        env:
          UV_SYSTEM_PYTHON: 1

      - name: Set up mkdocs config
        run: (envsubst '${{ steps.version.outputs.version }}' < mkdocs-template.yml) > mkdocs.yml

      - name: 🔄️ Sync mkdocs versions
        run: mkdocs-versioning sync

      - name: 🧹 Clean Docs
        run: rm -rf ./site/.git/

      - name: 🏗️ Build Docs
        run: mkdocs build

      - name: 🚀 Deploy Docs
        run: mkdocs-versioning -v deploy

      ## Docker
      # TODO: This should be a secondary job with "needs"
      # TODO: I'm pretty sure we DON'T need QEMU?
      - name: 🛠️ Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # TODO: This is publishing to dockerhub?
      # TODO: SHould we be using GHCR?
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏗️ Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          # images: ${{ env.IMAGE_NAME }}
          images: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}
          # TODO: These are a mismatch with the tests config?
          # type=ref,event=branch
          # type=ref,event=pr
          # type=semver,pattern={{major}}.{{minor}}
          tags: |
            type=semver,pattern={{raw}},value=v${{ steps.version.outputs.version }}

      - name: 🐳 Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPOSITORY }}/shared:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPOSITORY }}/shared:buildcache,mode=max
