name: 🚀📃 Publish Docs
on: [workflow_dispatch]
jobs:
  replace-docs:
    runs-on: ubuntu-latest
    name: 🚀📃 Rebuild and publish the latest docs
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 💾 Store VERSION
        run: |
          echo "VERSION=$(cat pyproject.toml | grep version | head -1 | awk -F: '{ print $1 }'| sed 's/[\",]//g'| tr -d 'version = ')" >> $GITHUB_ENV

      - name: 🐍 Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: ☀️ Setup UV
        uses: astral-sh/setup-uv@v5

      - name: 📥 Install docs dependencies
        run: uv pip install .[docs]
        env:
          UV_SYSTEM_PYTHON: 1

      - name: 📥 Install typer-cli
        run: uv pip install typer-cli
        env:
          UV_SYSTEM_PYTHON: 1

      - name: Set up mkdocs config
        run: |
          (envsubst 'v${VERSION}' < mkdocs-template.yml) > mkdocs.yml
          cat mkdocs.yml

      - name: 🔄️ Sync mkdocs versions
        run: mkdocs-versioning sync

      - name: 🧹 Clean Docs
        run: |
          rm -rf "./site/${VERSION}"
          rm -rf ./site/.git/

      - name: 🏗️ Build Docs
        run: mkdocs build

      - name: 🚀 Deploy Docs
        run: mkdocs-versioning -v deploy
