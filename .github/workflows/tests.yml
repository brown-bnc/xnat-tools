name: 🧪 Tests
on:
  pull_request:
# TODO: I don't believe this needs to run on merge with main anymore? To be confirmed
# push:
#   branches:
#     - "main"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XNAT_USER: ${{secrets.XNAT_USER}}
  XNAT_PASS: ${{secrets.XNAT_PASS}}
  # TODO: The real release uses DockerHub
  # TODO: Is it safe to use GHCR here? Better?
  REGISTRY: ghcr.io
  REPOSITORY: ${{ github.repository }}
  # IMAGE_NAME: brown-bnc/xnat-tools

jobs:
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    # outputs:
    #   full_image_id: ${{ steps.save_full_image_id.outputs.full_image_id }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7

      # TODO: We don't need this anymore?
      # TODO: Just hard-code the architecture k8s uses?
      # - name: Set up QEMU
      # uses: docker/setup-qemu-action@v2

      - name: 🛠️ Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into the container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Extract Docker Metadata
        uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}
          # NOTE: These image tags must NEVER touch :latest. Only the tag "pr-<N>" is pushed.
          flavor: latest=false
          tags: type=ref,event=pr

      - name: 🐳 Build and Push Docker Image
        id: build_and_push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64 # This must match the K8s environment's hardware
          push: true
          # One plain manifest, so deleting the pr-<N> version in cleanup leaves no orphaned attestations
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # NOTE: Cache is read from main and the branch but only written to its own cache
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    name: Run unit and integration tests
    runs-on: self-hosted
    # NOTE: Guards self-hosted runners from running on forks
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Run pytest
        run: 🧪 pytest -x -s -o log_cli=true --log-cli-level=INFO

