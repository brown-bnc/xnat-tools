name: 🧪 Tests

# TODO: IS there a reason this was running on push to main? Shouldn't be necessary?
on: pull_request
# on:
#   pull_request:
#   push:
#     branches:
#       - "main"
env:
  XNAT_USER: "${{secrets.XNAT_USER}}"
  XNAT_PASS: "${{secrets.XNAT_PASS}}"
  REGISTRY: ghcr.io
  REPOSITORY: ${{ github.repository }}

jobs:
  docker:
    name: 🐳 Build Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_id: ${{ steps.image_id.outputs.image_id }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7

      # TODO: I'm pretty sure we DON'T need QEMU?
      - name: 🛠️ Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # TODO: Should we use CJ for this?
      - name: 🔑 Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{major}}.{{minor}}

      # NOTE: We are tapping into json output because tags could become a list if prior step is modified
      - name: 💾 Save Image ID
        id: image_id
        run: |
          echo "${{ fromJSON(steps.meta.outputs.json).tags[0] }}"
          echo "::set-output name=image_id::${{ fromJSON(steps.meta.outputs.json).tags[0] }}"

      - name: 🐳 Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Include both a shared cache and a per-image cache
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.REPOSITORY }}/shared:buildcache
            type=registry,ref=${{ steps.image_id.outputs.image_id }}:buildcache
          cache-to: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.REPOSITORY }}/shared:buildcache,mode=max
            type=registry,ref=${{ steps.image_id.outputs.image_id }}:buildcache,mode=max

  test:
    name: 🧪 Pytest Tests
    needs: [docker]
    runs-on: self-hosted
    container:
      image: "${{ needs.docker.outputs.image_id }}"
    steps:
      - name: ➡️ Change Directory
        run: cd /xnat-tools

      - name: 🔬 Run pytest
        run: pytest -x -s -o log_cli=true --log-cli-level=INFO

  # TODO: This is the only test that actually validates if the xnat2bids data conforms to spec
  # TODO: This should be its own test within pytest itself?
  bids-validation:
    name: 🧪 Bids-validator Test
    needs: [docker]
    runs-on: self-hosted
    container:
      image: "${{ needs.docker.outputs.image_id }}"
    env:
      BIDS_ROOT: "/xnat2bids"
    steps:
      - name: ➡️ Change Directory
        run: cd /xnat-tools

      - name: 🏗️ Make Directory
        run: mkdir /xnat2bids/

      - name: 🏃‍➡️ Run xnat2bids
        run: |
          xnat2bids XNAT_E00114 ${BIDS_ROOT} -u ${{ env.XNAT_USER }} -p ${{ env.XNAT_PASS }} -s 6
          xnat2bids XNAT_E00152 ${BIDS_ROOT} -u ${{ env.XNAT_USER }} -p ${{ env.XNAT_PASS }} -s 6

      - name: ⎔ Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 18

      # TODO: The node package is deprecated? What should we do instead?
      # TODO: This seems to be an updated package? https://github.com/bids-standard/bids-validator
      - name: 📥 Install bids-validator
        run: npm install -g bids-validator

      - name: ➡️ Change Directory
        run: cd /xnat-tools

      - name: 🧪 Run bids-validator
        run: bids-validator ${BIDS_ROOT}
