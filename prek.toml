default_language_version.python = "python3"

# Prek built-in default checks
[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-yaml" },
  { id = "check-added-large-files" },
]

# Mypy typing
[[repos]]
repo = "https://github.com/pre-commit/mirrors-mypy"
rev = "v1.5.1"
hooks = [
  { id = "mypy", additional_dependencies = ["types-requests==2.28.8", "pandas-stubs==2.0.1.230501"] },
]

# Ruff formatting and linting
[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.17.4"
hooks = [
  # Run the linter and fix autofixable lint errors
  { id = "ruff-check", args = ["--fix"] },
  # Run the formatter
  { id = "ruff-format" },
]

# TODO?: Better type library? ty instead of mypy? pyrefly? What to do with typer?
