[project]
name = "xnat-tools"
version = "2.3.2"
description = ""
authors = [{ name = "Isabel Restrepo", email = "isabelrestre@gmail.com" }]
requires-python = "==3.10.6"
dependencies = [
    "coloredlogs>=15.0.1",
    # TODO: Should this pin a major version instead? Minor?
    "heudiconv==1.3.3",
    # TODO: Should this pin a major version instead? Minor?
    "pydicom==3.0.1",
    "pytest-mock>=3.8.2",
    "six>=1.16.0",
    # TODO: Switch type library to ty?
    "typer>=0.15.2",
    # TODO: Should this pin a major version instead? Minor?
    "mne-bids==0.16.0",
    "pandas>=2.2.2",
    "spec2nii>=0.8.0",
]

[project.scripts]
xnat2bids = "xnat_tools.xnat2bids:main"

[project.optional-dependencies]
dev = [
    # TODO: Delete in favor of ruff
    "black>=22.6.0,<23",
    "commitizen>=2.31.0,<3",
    # TODO: Delete in favor of ruff
    "flake8>=5.0.4,<6",
    # TODO: Switch type library to ty?
    "mypy>=1.5.1,<2",
    "pre-commit>=2.20.0,<3",
    "pytest>=7.1.2,<8",
    "python-dotenv>=0.20.0,<0.21",
    "responses>=0.21.0,<0.22",
    "pandas-stubs>=2.0.1.230501,<3",
    "ruff>=0.17.4,<1",
]

docs = [
    "mkdocs>=1.5,<2",
    "mkdocs-material>=9,<10",
    "mkdocstrings[python]>=0.23,<1",
    "mkdocs-versioning>=0.4,<1",
    "mkdocs-markdownextradata-plugin>=0.2,<1"
]

[tool.setuptools]
packages = ["xnat_tools"]

[tool.commitizen]
version = "2.3.2"
tag_format = "v$version"
version_files = [
    "pyproject.toml:version",
    "xnat_tools/__init__.py"
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude=["site",]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
strict_optional = false
ignore_missing_imports = true
